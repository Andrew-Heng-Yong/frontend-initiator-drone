<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thermal Node</title>
    <link rel="stylesheet" href="/styles.css?v=20260725-2" />
  </head>
  <body>
    <main>
      <header>
        <div class="header-left">
          <button id="start-toggle" class="start">Start node</button>
          <p id="connection">Waiting to start.</p>
        </div>
        <div class="imu-mini" id="imu-mini" aria-live="polite">IMU waiting</div>
        <div class="cpu-mini" id="cpu-mini" aria-hidden="false"></div>
        <div class="status"><span id="status-dot"></span><span id="status-text">Stopped</span></div>
      </header>
      <div class="content">
      <section class="controls" aria-label="Thermal node controls">
        <button id="start-button" class="start" style="display:none">Start node</button>
        <button id="stop-button" class="stop" disabled style="display:none">Stop node</button>
      </section>
      <!-- Large CPU panel removed; compact CPU shown in header -->
      <section class="viewer" aria-label="Thermal-guided cropped depth stream">
        <div class="viewer-layout">
          <div class="canvas-panel">
            <div id="range">--</div>
            <canvas id="thermal-canvas" width="32" height="24" aria-label="Thermal-guided cropped depth stream"></canvas>
          </div>
          <div class="tuning-panel" aria-label="Thermal tuning parameters">
            <div class="tuning-group">
              <h2>Overlay</h2>
              <p class="tuning-note">Live preview. Save to apply alignment to the ROS cropper.</p>
              <label class="overlay-alpha">
                <span>Blend</span>
                <input id="overlay-alpha" class="number-field" type="number" min="0" max="100" step="0.1" value="50.0" />
              </label>
              <label class="overlay-alpha">
                <span>X</span>
                <input id="thermal-offset-x" class="number-field" type="number" min="-320" max="320" step="0.1" value="0.0" />
              </label>
              <label class="overlay-alpha">
                <span>Y</span>
                <input id="thermal-offset-y" class="number-field" type="number" min="-240" max="240" step="0.1" value="0.0" />
              </label>
              <label class="overlay-alpha">
                <span>Scale</span>
                <input id="thermal-scale" class="number-field" type="number" min="50" max="150" step="0.1" value="100.0" />
              </label>
              <label class="overlay-alpha" title="Radial lens correction. Positive contracts the thermal image near the edges; negative expands it.">
                <span>Barrel</span>
                <input id="thermal-barrel-distortion" class="number-field" type="number" min="-1" max="1" step="0.001" value="0.000" />
              </label>
              <label class="overlay-alpha">
                <span>H</span>
                <input id="thermal-stretch-x" class="number-field" type="number" min="50" max="150" step="0.1" value="80.0" />
              </label>
              <label class="overlay-alpha">
                <span>V</span>
                <input id="thermal-stretch-y" class="number-field" type="number" min="50" max="150" step="0.1" value="90.0" />
              </label>
            </div>
            <div class="tuning-group">
              <h2>Cropper</h2>
              <p class="tuning-note">Saved for the next ROS start.</p>
              <label class="check-field">
                <input id="cropper-enabled" type="checkbox" />
                <span>Launch on next start</span>
              </label>
              <label class="check-field">
                <input id="cropper-passthrough" type="checkbox" />
                <span>Pass through when empty</span>
              </label>
              <label class="overlay-alpha">
                <span>Crop unit</span>
                <input id="cropper-unit" class="number-field" type="number" min="1" max="16" step="1" value="2" />
              </label>
              <label class="overlay-alpha">
                <span>Min region</span>
                <input id="cropper-min-region" class="number-field" type="number" min="1" max="768" step="1" value="15" />
              </label>
              <label class="overlay-alpha">
                <span>Inflation</span>
                <input id="cropper-inflation" class="number-field" type="number" min="0" max="32" step="1" value="2" />
              </label>
              <label class="overlay-alpha">
                <span>Min °C</span>
                <input id="cropper-min-temp" class="number-field" type="number" min="-100" max="1000" step="0.1" value="28.0" />
              </label>
              <label class="overlay-alpha">
                <span>Max °C</span>
                <input id="cropper-max-temp" class="number-field" type="number" min="-100" max="1000" step="0.1" value="40.0" />
              </label>
              <label class="overlay-alpha">
                <span>Low delta</span>
                <input id="cropper-low-delta" class="number-field" type="number" min="0" max="1000" step="0.1" value="3.0" />
              </label>
              <label class="overlay-alpha">
                <span>High delta</span>
                <input id="cropper-high-delta" class="number-field" type="number" min="0" max="1000" step="0.1" value="1000.0" />
              </label>
            </div>
            <button id="save-params" class="save-params" type="button">Save to parameter file</button>
          </div>
        </div>
      </section>
      </div>
      <section class="log-panel">
        <div id="log-resize-handle" class="log-resize-handle" title="Drag to resize launch output"></div>
        <div class="log-header">
          <h2>Launch output</h2>
          <div class="log-actions">
            <button id="copy-logs" class="clear">Copy</button>
            <button id="clear-logs" class="clear">Clear</button>
          </div>
        </div>
        <pre id="logs">No launch output yet.</pre>
      </section>
    </main>
    <script src="/app.js?v=20260725-3"></script>
  </body>
</html>
